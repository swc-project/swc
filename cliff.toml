# Configuration for swc-releaser and git-cliff 2.8.0.

[changelog]
# changelog header
header = """
# Changelog
"""
# template for the changelog body
# https://tera.netlify.app/docs/#introduction
# swc-releaser enriches git-cliff's context with changeset sections.
body = '''{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [unreleased]
{% endif -%}
{% for section in extra.sections %}
### {{ section.title }}
{% for entry in section.entries %}
- {% if entry.scope %}**({{ entry.scope }})** {% endif %}{{ entry.title | upper_first }}{% if entry.pr %} ([#{{ entry.pr }}](https://github.com/swc-project/swc/pull/{{ entry.pr }})){% endif %}{% if entry.id %} ([{{ entry.id | truncate(length=7, end="") }}](https://github.com/swc-project/swc/commit/{{ entry.id }})){% endif %}
{% if entry.crates | length > 0 %}
  **Crates:** {{ entry.crates | join(sep=", ") }}
{% endif -%}
{% if entry.body %}
{{ entry.body }}
{% endif -%}
{% endfor -%}
{% endfor %}
'''
# Keep indentation inside Markdown list items.
trim = false
# changelog footer
footer = "<!-- generated by swc-releaser with git-cliff -->"

[git]
# allow only conventional commits
# https://www.conventionalcommits.org
conventional_commits  = true
filter_unconventional = false

commit_preprocessors = [
  { pattern = "\\(#([0-9]+)\\)", replace = "([#${1}](https://github.com/swc-project/swc/issues/${1}))" },
]
# Internal commits are omitted by swc-releaser after reading their changesets.
# Keeping them in the context preserves releases containing only changeset commits.
# regex for parsing and grouping commits
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^doc", group = "Documentation" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactor" },
  { message = "^style", group = "Styling" },
  { message = "^test", group = "Testing" },
  { message = "^chore: Publish", group = "Internal" },
  { message = "^chore:", group = "Internal" },
  { message = "^chore\\(ci\\):", group = "Internal" },
  { message = "^chore\\(xtask\\):", group = "Internal" },
  { message = "^chore", group = "Miscellaneous Tasks" },
  { body = ".*security", group = "Security" },
]
# filter out the commits that are not matched by commit parsers
filter_commits = false
# glob pattern for matching git tags
ignore_tags   = "nightly|.*@"
limit_commits = 1000
tag_pattern   = "v[0-9]*"
