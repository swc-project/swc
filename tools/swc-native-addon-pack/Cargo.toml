[package]
name = "swc_native_addon_pack"
version = "0.1.0"
edition = "2021"
rust-version = "1.73"
license = "Apache-2.0"
publish = false

[[bin]]
name = "swc-native-addon-pack"
path = "src/main.rs"

[[bin]]
name = "swc-native-addon-verify"
path = "src/verify.rs"

[dependencies]
swc_native_addon = { path = "../../crates/swc_native_addon" }
tempfile = "=3.12.0"
memchr = "=2.7.6"
object = { version = "=0.36.7", default-features = false, features = ["read", "std"] }
serde_json = "=1.0.140"
sha2 = "=0.10.8"
