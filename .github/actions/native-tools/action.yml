name: Native artifact verifier
description: Build the private host verifier with the repository toolchain
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      with:
        toolchain: nightly-2026-04-10
    - name: Build host tools
      shell: bash
      env:
        RUSTFLAGS: ""
        CARGO_ENCODED_RUSTFLAGS: ""
      run: |
        cargo build --locked -p swc_native_addon_pack --release
        echo "SWC_NATIVE_TOOLS=$GITHUB_WORKSPACE/target/release" >> "$GITHUB_ENV"
