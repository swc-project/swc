version: 3

# rust-toolchain has no release tags. Keep this exception limited to the
# reviewed upstream commit; all other action pins still require verification.
rules:
  - ignore: true
    conditions:
      - expr: >-
          ActionName == "dtolnay/rust-toolchain" &&
          ActionVersion == "6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772"
