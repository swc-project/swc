name: Native load diagnostics
on:
  workflow_dispatch:
  push:
    branches: [codex/fix-native-release-ci]
    paths: [.github/workflows/native-diagnostic.yml, scripts/native/diagnostic.py, scripts/native/diagnostic-windows.ps1]
permissions:
  contents: read
  actions: read
jobs:
  measure:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        product: [core, html]
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          package-manager-cache: false
          node-version: ${{ matrix.node }}
          architecture: x64
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm build:ts
        working-directory: packages/${{ matrix.product }}
      - uses: ./.github/actions/native-tools
      - name: Retrieve failed release candidate
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT: ${{ matrix.product }}
        run: gh run download 35858146342 -n "bindings-verification-$PRODUCT-1.16.9-nightly-20260923.1-x86_64-apple-darwin" -D target/diagnostic-input
      - name: Build instrumented carrier
        env:
          PRODUCT: ${{ matrix.product }}
        run: |
          if [ "$PRODUCT" = core ]; then filename=swc.darwin-x64.node; else filename=swc-html.darwin-x64.node; fi
          echo "FILENAME=$filename" >> "$GITHUB_ENV"
          "$SWC_NATIVE_TOOLS/swc-native-addon-verify" --input "target/diagnostic-input/$filename" --target x86_64-apple-darwin --extract "$GITHUB_WORKSPACE/target/diagnostic-input/raw.node"
          "$SWC_NATIVE_TOOLS/swc-native-addon-pack" --input target/diagnostic-input/raw.node --target x86_64-apple-darwin --output "$GITHUB_WORKSPACE/target/diagnostic-input/payload.swcn"
          python3 scripts/native/diagnostic.py
          rustup target add x86_64-apple-darwin
          SWC_NATIVE_BINDING_PAYLOAD="$GITHUB_WORKSPACE/target/diagnostic-input/payload.swcn" cargo build --release -p binding_native_addon --features embedded-payload --target x86_64-apple-darwin
          cp target/x86_64-apple-darwin/release/libbinding_native_addon.dylib target/diagnostic-input/carrier.node
          codesign --force --sign - target/diagnostic-input/carrier.node
      - name: Measure existing cold and warm gates
        env:
          PRODUCT: ${{ matrix.product }}
        run: node scripts/native/diagnostic.mjs "$PRODUCT" target/diagnostic-input/raw.node target/diagnostic-input/carrier.node "$FILENAME"
  windows-delete:
    if: false
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Compare mapped DLL deletion modes
        shell: pwsh
        run: ./scripts/native/diagnostic-windows.ps1
