name: Native load diagnostics
on:
  workflow_dispatch:
  push:
    branches: [codex/fix-native-release-ci]
    paths: [.github/workflows/native-diagnostic.yml, scripts/native/diagnostic.py]
permissions:
  contents: read
  actions: read
jobs:
  calibrate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          package-manager-cache: false
          node-version: "22"
          architecture: x64
      - run: corepack enable && pnpm install --frozen-lockfile
      - uses: ./.github/actions/native-tools
      - name: Extract verified raw control image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 35949055402 -n bindings-verification-core-1.16.9-nightly-20260923.1-x86_64-apple-darwin -D target/diagnostic-input
          "$SWC_NATIVE_TOOLS/swc-native-addon-verify" --input target/diagnostic-input/swc.darwin-x64.node --target x86_64-apple-darwin --extract "$GITHUB_WORKSPACE/target/diagnostic-input/raw.node"
      - run: pnpm build:ts
        working-directory: packages/core
      - name: Compare identical images with fixed and balanced sample order
        run: node scripts/native/calibration.mjs
