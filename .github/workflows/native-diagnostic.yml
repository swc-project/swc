name: Native verification scheduling comparison
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  CI: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_RELEASE_LTO: fat
  MACOSX_DEPLOYMENT_TARGET: "10.13"
  NODE_OPTIONS: --max-old-space-size=6144
jobs:
  compare:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          package-manager-cache: false
          node-version: ${{ matrix.node }}
          architecture: x64
      - run: corepack enable && pnpm install --frozen-lockfile
      - uses: ./.github/actions/native-tools
      - run: pnpm build:ts
        working-directory: packages/core
      - name: Compare complete verification on the same host
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 35988753734 -n bindings-verification-core-1.16.9-nightly-20260923.1-x86_64-apple-darwin -D target/diagnostic-input
          "$SWC_NATIVE_TOOLS/swc-native-addon-verify" --input target/diagnostic-input/swc.darwin-x64.node --target x86_64-apple-darwin --extract "$GITHUB_WORKSPACE/target/diagnostic-input/raw.node"
          "$SWC_NATIVE_TOOLS/swc-native-addon-pack" --input target/diagnostic-input/raw.node --target x86_64-apple-darwin --output "$GITHUB_WORKSPACE/target/diagnostic-input/payload.swcn"
          cp crates/swc_native_addon/src/integrity.rs target/diagnostic-input/integrity.rs
          cp crates/swc_native_addon/src/format.rs target/diagnostic-input/format.rs
          cp crates/swc_native_addon/src/cache.rs target/diagnostic-input/cache.rs
          rustup target add x86_64-apple-darwin
          failures=0
          for variant in current worker-stream; do
            python3 scripts/native/diagnostic-scheduling.py "$variant"
            SWC_NATIVE_BINDING_PAYLOAD="$GITHUB_WORKSPACE/target/diagnostic-input/payload.swcn" cargo build --locked --release -p binding_native_addon --features embedded-payload --target x86_64-apple-darwin
            cp target/x86_64-apple-darwin/release/libbinding_native_addon.dylib "target/diagnostic-input/$variant.node"
            strip -x "target/diagnostic-input/$variant.node"
            codesign --force --sign - "target/diagnostic-input/$variant.node"
            "$SWC_NATIVE_TOOLS/swc-native-addon-verify" --input "target/diagnostic-input/$variant.node" --target x86_64-apple-darwin --raw target/diagnostic-input/raw.node
            if ! node scripts/native/diagnostic-scheduling.mjs "$variant"; then
              failures=1
            fi
          done
          exit "$failures"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: native-scheduling-node-${{ matrix.node }}
          path: target/diagnostic-results/*.json
          if-no-files-found: error
