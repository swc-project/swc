name: Changeset

on:
  pull_request:

permissions: {}

jobs:
  changeset:
    name: Require changeset for crate changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Test changeset check
        run: node --test scripts/github/check-changeset.test.mjs

      - name: Check pull request changeset
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            "/repos/${REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            | node scripts/github/check-changeset.mjs
