name: GitHub Actions Security

on:
  pull_request:
    paths:
      - ".github/contributors.yml"
      - ".github/actions/**"
      - ".github/workflows/**"
      - "renovate.json"
      - "deny.toml"
  push:
    branches:
      - main
    paths:
      - ".github/contributors.yml"
      - ".github/actions/**"
      - ".github/workflows/**"
      - "renovate.json"
      - "deny.toml"
  workflow_dispatch:

permissions: {}

jobs:
  contributor-policy:
    name: Check contributor
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      allowed: ${{ steps.policy.outputs.allowed }}
    steps:
      # The gate must use the policy on the default branch, not PR changes.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .contributor-policy
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/contributors.yml
            /.github/actions/contributor-policy/

      - uses: ./.contributor-policy/.github/actions/contributor-policy
        id: policy
        with:
          token: ${{ github.token }}

  contributor-policy-tests:
    name: Contributor policy tests
    needs: contributor-policy
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.contributor-policy.outputs.allowed == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Proposed policy code is tested only in this read-only PR job.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Test policy and workflow contracts
        working-directory: .github/actions/contributor-policy
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test

  actionlint:
    name: actionlint
    needs: contributor-policy
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.contributor-policy.outputs.allowed == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install actionlint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="1.7.12"
          archive="actionlint_${version}_linux_amd64.tar.gz"
          install_dir="${RUNNER_TEMP}/actionlint"
          mkdir -p "$install_dir"

          gh release download "v${version}" \
            --repo rhysd/actionlint \
            --pattern "$archive" \
            --pattern "actionlint_${version}_checksums.txt" \
            --dir "$install_dir"

          cd "$install_dir"
          grep "  ${archive}$" "actionlint_${version}_checksums.txt" | sha256sum --check
          tar -xzf "$archive" actionlint
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Check workflows
        run: actionlint -color -shellcheck=

  pinact:
    name: pinact
    needs: contributor-policy
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.contributor-policy.outputs.allowed == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: suzuki-shunsuke/pinact-action@cf51507d80d4d6522a07348e3d58790290eaf0b6 # v2.0.0
        with:
          skip_push: "true"
          verify: "true"

  zizmor:
    name: zizmor
    needs: contributor-policy
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.contributor-policy.outputs.allowed == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: v1.25.2
          inputs: ".github/workflows .github/actions"
          min-confidence: high
          min-severity: medium
          advanced-security: "false"
          annotations: "true"
