name: "Publish"
run-name: "Publish ${{ inputs.version }}"

env:
  CI: 1
  # 7 GiB by default on GitHub, setting to 6 GiB
  # https://docs.github.com/en/actions/using-github-hosted-runners/about-github-hosted-runners#supported-runners-and-hardware-resources
  NODE_OPTIONS: --max-old-space-size=6144

permissions: {}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish"
        required: true
        type: string
      skipBuild:
        description: "Skip build. Used to debug swc-ecosystem-ci."
        required: false
        type: boolean
        default: false
      onlyNightly:
        description: "Publish only nightly"
        required: false
        type: boolean
        default: false
      allowBreakingWasm:
        description: "Allow breaking changes in wasm"
        required: false
        type: boolean
        default: false
      verifySourceRef:
        description: "Verify this exact commit SHA without creating tags or publishing (version must match its manifests)"
        required: false
        type: string
        default: ""

concurrency:
  group: ${{ inputs.verifySourceRef && format('native-verification-{0}', github.ref) || github.workflow }}
  cancel-in-progress: true

jobs:
  verify-native-source:
    name: "Verify native release without publishing"
    if: inputs.verifySourceRef != ''
    # Reusable-workflow permissions are checked even for skipped publish jobs.
    # skipPublishing disables those jobs and the source-ref guard enforces it.
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/publish-npm-package.yml
    with:
      buildType: "verification"
      version: ${{ inputs.version }}
      buildCli: true
      skipBuild: false
      publishWasm: false
      skipPublishing: true
      sourceRef: ${{ inputs.verifySourceRef }}

  determine-nightly-version:
    name: "Determine nightly version"
    runs-on: ubuntu-latest
    # Run only on main branch
    if: github.ref == 'refs/heads/main' && inputs.verifySourceRef == ''
    permissions:
      contents: read
    outputs:
      version: ${{ steps.determine-nightly-version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
        with:
          cache: "false"
      - name: Determine nightly version
        id: determine-nightly-version
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: |
          npx ts-node .github/bot/src/nightly-version.ts "$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

  git-tag-nightly:
    name: "Git tag nightly"
    runs-on: ubuntu-latest
    needs:
      - determine-nightly-version
    environment: publish
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: bot-token
        if: inputs.skipBuild == false
        with:
          client-id: ${{ vars.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: ./.github/actions/tag-git-release
        if: inputs.skipBuild == false
        with:
          version: ${{ needs.determine-nightly-version.outputs.version }}
          token: ${{ steps.bot-token.outputs.token }}
          app-slug: ${{ steps.bot-token.outputs.app-slug }}

  publish-npm-nightly:
    name: "Publish ${{ needs.determine-nightly-version.outputs.version }}"
    needs:
      - git-tag-nightly
      - determine-nightly-version
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/publish-npm-package.yml
    with:
      buildType: "nightly"
      version: ${{ needs.determine-nightly-version.outputs.version }}
      buildCli: true
      skipBuild: ${{ inputs.skipBuild || false }}
      publishWasm: true
      skipPublishing: ${{ github.event_name == 'pull_request' }}

  run-ecosystem-ci-with-nightly:
    name: "Test nightly using ecosystem CI"

    needs:
      - determine-nightly-version
      - publish-npm-nightly
    permissions:
      contents: read
    uses: ./.github/workflows/ecosystem-ci.yml
    with:
      version: ${{ needs.determine-nightly-version.outputs.version }}
      mode: "passing"
      suites: '["_"]'
      allowBreakingWasm: ${{ inputs.allowBreakingWasm || false }}

  git-tag-stable:
    name: "Git tag stable"
    runs-on: ubuntu-latest
    if: inputs.onlyNightly == false
    needs:
      - git-tag-nightly
      - run-ecosystem-ci-with-nightly
    environment: publish
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: bot-token
        if: inputs.skipBuild == false
        with:
          client-id: ${{ vars.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: ./.github/actions/tag-git-release
        if: inputs.skipBuild == false
        with:
          version: ${{ inputs.version }}
          token: ${{ steps.bot-token.outputs.token }}
          app-slug: ${{ steps.bot-token.outputs.app-slug }}

  manage-milestone:
    name: "Manage milestone for ${{ inputs.version }}"
    runs-on: ubuntu-latest
    if: inputs.onlyNightly == false
    needs:
      - git-tag-stable
      - publish-npm-stable
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-node
        with:
          cache: "false"
      - name: Manage milestone
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ inputs.version }}
        run: |
          npx ts-node .github/bot/src/milestone-manager.ts "$RELEASE_TAG"

  publish-npm-stable:
    name: "Publish ${{ inputs.version || 'stable' }} to npm"
    needs:
      - run-ecosystem-ci-with-nightly
      - git-tag-stable

    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/publish-npm-package.yml
    with:
      buildType: "stable"
      version: ${{ inputs.version }}
      buildCli: true
      skipBuild: ${{ inputs.skipBuild || inputs.onlyNightly || false }}
      publishWasm: true
      skipPublishing: ${{ github.event_name == 'pull_request' }}
