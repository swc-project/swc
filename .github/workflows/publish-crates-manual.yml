name: "Publish crates"

env:
  CI: 1
  # 7 GiB by default on GitHub, setting to 6 GiB
  # https://docs.github.com/en/actions/using-github-hosted-runners/about-github-hosted-runners#supported-runners-and-hardware-resources
  NODE_OPTIONS: --max-old-space-size=6144

permissions: {}

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  publish-cargo:
    name: "Publish cargo crates"
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: "main"

      - uses: ./.github/actions/setup-node
        with:
          cache: "false"

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly-2026-04-10
          # The pre-push hook runs cargo fmt with the repository toolchain.
          components: rustfmt

      - name: Install cargo-edit
        uses: taiki-e/install-action@3235f8901fd37ffed0052b276cec25a362fb82e9 # v2.77.7
        with:
          tool: cargo-edit@0.12.2

      - name: Install git-cliff
        uses: taiki-e/install-action@3235f8901fd37ffed0052b276cec25a362fb82e9 # v2.77.7
        with:
          tool: git-cliff@2.8.0

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: bot-token
        with:
          client-id: ${{ vars.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: ./.github/actions/configure-bot-git
        with:
          token: ${{ steps.bot-token.outputs.token }}
          app-slug: ${{ steps.bot-token.outputs.app-slug }}

      - name: Publish crates
        run: |
          set -eux
          git pull --ff-only origin main
          cargo bump
          git push origin main
          git push origin --tags
