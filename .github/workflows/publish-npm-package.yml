  test-minimum-binding:
    name: Minimum Node ${{ matrix.settings.node }} - ${{ matrix.settings.package }}
    needs: [assemble]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        settings:
          - { package: core, node: "10.0.0" }
          - { package: html, node: "14.0.0" }
          - { package: minifier, node: "12.0.0" }
          - { package: minifier, node: "14.0.0" }
          - { package: react-compiler, node: "20.0.0" }
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          ref: "v${{ inputs.version }}"
          submodules: recursive
      - uses: ./.github/actions/setup-node
        with:
          node-version: "20"
      - name: Record tooling Node
        id: tooling-node
        run: echo "path=$(node -p process.execPath)" >> "$GITHUB_OUTPUT"
      - name: Download addon
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: bindings-${{ inputs.buildType }}-${{ matrix.settings.package }}-${{ inputs.version }}-x86_64-unknown-linux-gnu
          path: packages/${{ matrix.settings.package }}
      - name: Download report
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: native-report-${{ inputs.buildType }}-${{ matrix.settings.package }}-${{ inputs.version }}-x86_64-unknown-linux-gnu
          path: target/native-reports
      - name: Download npm tarballs
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: native-npm-${{ inputs.buildType }}-${{ matrix.settings.package }}-${{ inputs.version }}
          path: target/npm/${{ matrix.settings.package }}
      - name: Build TypeScript with tooling Node
        working-directory: packages/${{ matrix.settings.package }}
        run: pnpm build:ts
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.settings.node }}
          architecture: x64
      - name: Test minimum runtime through both package layouts
        env:
          PACKAGE: ${{ matrix.settings.package }}
          TOOLING_NODE: ${{ steps.tooling-node.outputs.path }}
          MINIMUM_NODE: ${{ matrix.settings.node }}
        run: |
          export SWC_RUNTIME_NODE="$(node -p process.execPath)"
          "$TOOLING_NODE" scripts/native/runtime.mjs "$PACKAGE" x86_64-unknown-linux-gnu "target/native-runtime-reports/$PACKAGE-minimum-$MINIMUM_NODE.json" minimum
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-runtime-${{ inputs.buildType }}-${{ matrix.settings.package }}-${{ inputs.version }}-minimum-${{ matrix.settings.node }}
          path: target/native-runtime-reports/*.json
          if-no-files-found: error

  test-carrier-platform:
    name: Native carrier lifecycle - ${{ matrix.host }}
    needs: [build]
    runs-on: ${{ matrix.host }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        host: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          ref: "v${{ inputs.version }}"
          submodules: recursive
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "20"
      - uses: ./.github/actions/native-tools
      - name: Verify private crates and native registration
        shell: bash
        run: cargo test -p swc_native_addon -p swc_native_addon_pack -p binding_native_addon
      - name: Verify APFS replacement
        if: runner.os == 'macOS'
        shell: bash
        run: SWC_TEST_VOLUME="$RUNNER_TEMP" cargo test -p swc_native_addon --test platform apfs_self_replacement -- --ignored --exact
      - name: Verify NTFS compression and process-exit cleanup
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo test -p swc_native_addon --test platform ntfs_compression -- --ignored --exact
          cargo test -p swc_native_addon --test platform temporary_cleanup_after_process_exit -- --exact
      - name: Verify btrfs replacement
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y btrfs-progs
          image="$RUNNER_TEMP/native-btrfs.img"
          volume="$RUNNER_TEMP/native-btrfs"
          truncate -s 1G "$image"
          mkfs.btrfs "$image"
          mkdir "$volume"
          sudo mount -o loop "$image" "$volume"
          trap 'sudo umount "$volume"' EXIT
          sudo chown "$(id -u):$(id -g)" "$volume"
          SWC_TEST_VOLUME="$volume" cargo test -p swc_native_addon --test platform btrfs_self_replacement -- --ignored --exact

  verify-native-release:
    name: Verify all 48 native artifacts
    needs:
      - assemble
      - test-macOS-windows-binding
      - test-linux-x64-gnu-binding
      - test-linux-x64-musl-binding
      - test-minimum-binding
      - test-carrier-platform
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          ref: "v${{ inputs.version }}"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "20"
      - uses: ./.github/actions/native-tools
      - name: Download all prepared packages
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: native-npm-${{ inputs.buildType }}-*-${{ inputs.version }}
          path: target/native-prepared
      - name: Download all runtime reports
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: native-runtime-${{ inputs.buildType }}-*-${{ inputs.version }}-*
          merge-multiple: true
          path: target/native-runtime-reports
      - name: Gate the complete release
        run: node scripts/native/gate.mjs target/native-prepared target/native-runtime-reports target/native-gate.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-gate-${{ inputs.buildType }}-${{ inputs.version }}
          path: target/native-gate.json
          if-no-files-found: error

  publish:
    name: Publish verified ${{ matrix.package }}@${{ inputs.version }}
    environment: publish
    if: ${{ !inputs.skipPublishing }}
    needs: [verify-native-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        package: [core, html, minifier, react-compiler]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          ref: "v${{ inputs.version }}"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
      - name: Update npm for trusted publishing
        run: npm install -g npm@latest
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: native-npm-${{ inputs.buildType }}-${{ matrix.package }}-${{ inputs.version }}
          path: target/npm/${{ matrix.package }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: native-gate-${{ inputs.buildType }}-${{ inputs.version }}
          path: target
      - name: Publish exact verified tarballs
        env:
          PACKAGE: ${{ matrix.package }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/native/publish.mjs "$PACKAGE" "target/npm/$PACKAGE" target/native-gate.json
      - name: Upload existing CLI binaries to GitHub release
        if: matrix.package == 'core'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: v${{ inputs.version }}
        run: |
          mkdir -p packages/core/artifacts_cli
          cp -p target/npm/core/cli/* packages/core/artifacts_cli/
          ./scripts/cli_upload_gh_release.sh

  publish-wasm:
    environment: publish
    name: Build - wasm (${{ matrix.settings.npm }})
    if: ${{ inputs.publishWasm && !inputs.skipPublishing }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs:
      - publish
    strategy:
      fail-fast: false
      matrix:
        settings:
          - package: "core"
            crate: "binding_core_wasm"
            npm: "@swc\\/wasm"
            target: nodejs
            out: "pkg"
          - package: "core"
            crate: "binding_core_wasm"
            npm: "@swc\\/wasm-web"
            target: web
            out: "pkg"
          - package: "core"
            crate: "binding_typescript_wasm"
            npm: "@swc\\/wasm-typescript"
            build: "./scripts/build.sh"
            out: "pkg"
          - package: "core"
            crate: "binding_typescript_wasm"
            npm: "@swc\\/wasm-typescript-esm"
            build: "./scripts/esm.sh"
            out: "esm"
          - package: "core"
            crate: "binding_nodejs_support_wasm"
            npm: "@swc\\/nodejs-support-wasm"
            build: "./scripts/build.sh"
            out: "pkg"
          - package: "html"
            crate: "binding_html_wasm"
            npm: "@swc\\/html-wasm"
            target: nodejs
            out: "pkg"
          # - crate: "binding_es_ast_viewer"
          #   npm: "@swc\\/es-ast-viewer"
          #   build: "./scripts/build.sh"
          #   out: "pkg"

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          ref: "v${{ inputs.version }}"
          submodules: recursive

      - name: Corepack
        run: corepack enable

      - name: Tag npm release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$RELEASE_VERSION" != *"nightly"* ]]; then
            echo "NPM_TAG=latest" >> "$GITHUB_ENV"
          else
            echo "NPM_TAG=nightly" >> "$GITHUB_ENV"
          fi

      - name: Setup node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24

      - name: Install node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build
        if: ${{ !matrix.settings.build }}
        env:
          CRATE: ${{ matrix.settings.crate }}
          NPM_PACKAGE: ${{ matrix.settings.npm }}
          WASM_TARGET: ${{ matrix.settings.target }}
        run: |
          cd "bindings/$CRATE"
          wasm-pack build --out-name wasm --release --scope=swc --target "$WASM_TARGET"
          sed -i -e "s/\"name\": \"@swc\\/${CRATE}\"/\"name\": \"${NPM_PACKAGE}\"/g" pkg/package.json

      - name: Build
        if: ${{ matrix.settings.build }}
        env:
          TARGET: ${{ matrix.settings.target }}
          BUILD_SCRIPT: ${{ matrix.settings.build }}
          CRATE: ${{ matrix.settings.crate }}
        run: |
          cd "bindings/$CRATE"
          bash -lc "$BUILD_SCRIPT"

      - name: Update npm
        run: npm install -g npm@latest

      - name: Publish
        if: ${{ !inputs.skipBuild }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CRATE: ${{ matrix.settings.crate }}
          OUT_DIR: ${{ matrix.settings.out }}
        run: |
          cd "bindings/$CRATE/$OUT_DIR"
          npm publish --access public --tag "$NPM_TAG"
