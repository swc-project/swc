  test-linux-x64-gnu-binding:
    name: Test ${{ matrix.package }} bindings on Linux-x64-gnu - node@${{ matrix.node }}
    needs:
      - assemble
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package: [core, html, minifier, react-compiler]
        settings:
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
        node:
          - "20"
          - "22"
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          ref: "v${{ inputs.version }}"
          submodules: recursive

      - name: Corepack
        run: corepack enable
      - name: Setup node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Download artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: bindings-${{ inputs.buildType }}-${{ matrix.package }}-${{ inputs.version}}-${{ matrix.settings.target }}
          path: ./packages/${{ matrix.package }}
      - name: Download verification report
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: native-report-${{ inputs.buildType }}-${{ matrix.package }}-${{ inputs.version }}-${{ matrix.settings.target }}
          path: target/native-reports
      - name: Download prepared npm packages
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: native-npm-${{ inputs.buildType }}-${{ matrix.package }}-${{ inputs.version }}
          path: target/npm/${{ matrix.package }}
      - uses: ./.github/actions/native-tools
      - name: Verify and extract raw comparison image
        shell: bash
        env:
          PACKAGE: ${{ matrix.package }}
          TARGET: ${{ matrix.settings.target }}
        run: node scripts/native/extract.mjs "$PACKAGE" "$TARGET"
      - name: List packages
        run: ls -R .
        shell: bash
      - name: Build TypeScript
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          cd "packages/$PACKAGE"
          pnpm build:ts
      - name: Test bindings
        env:
          NODE_VERSION: ${{ matrix.node }}
          TARGET: ${{ matrix.settings.target }}
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          case "$PACKAGE" in
            core | html | minifier | react-compiler) ;;
            *)
              echo "Unsupported package: $PACKAGE" >&2
              exit 1
              ;;
          esac

          case "$NODE_VERSION" in
            20) NODE_IMAGE="node:20-slim@sha256:2cf067cfed83d5ea958367df9f966191a942351a2df77d6f0193e162b5febfc0" ;;
            22) NODE_IMAGE="node:22-slim@sha256:689c11043dad91472750cd824c97dd5e2318e9dd6f954e492fe7af0135d33ceb" ;;
            *)
              echo "Unsupported Node.js version: $NODE_VERSION" >&2
              exit 1
              ;;
          esac

          PACKAGE_MANAGER="$(node -p "require('./package.json').packageManager")"
          case "$PACKAGE_MANAGER" in
            pnpm@*) ;;
            *)
              echo "Unsupported packageManager: $PACKAGE_MANAGER" >&2
              exit 1
              ;;
          esac

          export SOURCE_COMMIT="$(git rev-parse HEAD)"
          docker run --rm \
            -e SOURCE_COMMIT \
            -e BUILD_TYPE \
            -e RELEASE_VERSION \
            -e TARGET \
            -e COREPACK_VERSION="$COREPACK_VERSION" \
            -e PACKAGE \
            -e PACKAGE_MANAGER="$PACKAGE_MANAGER" \
            -v "$PWD:/swc" \
            -w /swc \
            "$NODE_IMAGE" \
            sh -c 'npm install -g "corepack@${COREPACK_VERSION}" && corepack enable && corepack prepare "${PACKAGE_MANAGER}" --activate && env DISABLE_PLUGIN_E2E_TESTS=true SWC_NATIVE_BINDING_CACHE=0 pnpm "test:${PACKAGE}" && node scripts/native/runtime.mjs "$PACKAGE" "$TARGET" "target/native-runtime-reports/$PACKAGE-$TARGET-${{ matrix.node }}.json"'
      - name: Upload runtime verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-runtime-${{ inputs.buildType }}-${{ matrix.package }}-${{ inputs.version }}-${{ matrix.settings.target }}-${{ matrix.node }}
          path: target/native-runtime-reports/*.json
          if-no-files-found: error
