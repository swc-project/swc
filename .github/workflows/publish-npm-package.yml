name: "Build and verify native npm release"

concurrency:
  group: native-release-${{ github.ref }}-${{ inputs.buildType }}-${{ inputs.version }}
  cancel-in-progress: true

env:
  BUILD_TYPE: ${{ inputs.buildType }}
  RELEASE_VERSION: ${{ inputs.version }}
  DEBUG: napi:*
  APP_NAME: swc
  MACOSX_DEPLOYMENT_TARGET: "10.13"
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_RELEASE_LTO: "fat"
  CI: "1"
  COREPACK_VERSION: "0.33.0"
  DISABLE_PLUGIN_E2E_TESTS: true
  GIT_AUTHOR_NAME: "SWC Bot"
  GIT_AUTHOR_EMAIL: "bot@swc.rs"
  GIT_COMMITTER_NAME: "SWC Bot"
  GIT_COMMITTER_EMAIL: "bot@swc.rs"

permissions: {}

on:
  workflow_call:
    inputs:
      buildType:
        type: string
        required: true
      version:
        type: string
        required: true
      buildCli:
        type: boolean
        required: true
      skipBuild:
        type: boolean
        required: true
      publishWasm:
        type: boolean
        required: true
      skipPublishing:
        type: boolean
        required: true

jobs:
  check-if-build-required:
    name: Check if build is required
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Run only on main branch
    if: github.ref == 'refs/heads/main'
    outputs:
      need-build: ${{ steps.check.outputs.need-build }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      # TODO: Check for existing artifacts
      - id: check
        if: ${{ !inputs.skipBuild }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          case "$RELEASE_VERSION" in
            *[!A-Za-z0-9._-]* | "")
              echo "Unsupported version: $RELEASE_VERSION" >&2
              exit 1
              ;;
          esac

          echo "need-build=true" >> "$GITHUB_OUTPUT"

  build:
    if: needs.check-if-build-required.outputs.need-build == 'true'
    needs:
      - check-if-build-required
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package: [core, html, minifier, react-compiler]
        settings:
          - host: macos-latest
            target: x86_64-apple-darwin
            build: |
              if [[ $PACKAGE == "core" ]]; then
                cargo build --manifest-path ../../bindings/swc_cli/Cargo.toml --release --features plugin --target x86_64-apple-darwin
                cp ../../target/x86_64-apple-darwin/release/swc .
                chmod +x ./swc
              fi
              pnpm build --target x86_64-apple-darwin
              strip -x *.node
          - host: windows-latest
            build: |
              export CARGO_PROFILE_RELEASE_LTO=false
              pnpm build --target x86_64-pc-windows-msvc
              if [[ $PACKAGE == "core" ]]; then
                cargo build --manifest-path ../../bindings/swc_cli/Cargo.toml --release --features plugin --target x86_64-pc-windows-msvc
                cp ../../target/x86_64-pc-windows-msvc/release/swc .
              fi
            target: x86_64-pc-windows-msvc
          - host: windows-latest
            # Use x64 Node.js for installation because ia32 Node.js cannot allocate enough memory.
            build: |
              export DISABLE_PLUGIN_E2E_TESTS=true
              export CARGO_PROFILE_RELEASE_LTO=false
              if [[ $PACKAGE == "core" ]]; then
                cargo build --manifest-path ../../bindings/swc_cli/Cargo.toml --release --target i686-pc-windows-msvc
                cp ../../target/i686-pc-windows-msvc/release/swc .
                pnpm build --target i686-pc-windows-msvc --no-default-features --features swc_v1
              else
                pnpm build --target i686-pc-windows-msvc
              fi
            target: i686-pc-windows-msvc
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-debian@sha256:6f910fc8a723a1eeab2483d2302e8c1fabe36e54c51eb0da27fafd5c3083e08c
            build: >-
              set -e &&
              unset CC_x86_64_unknown_linux_gnu && unset CC && RUSTFLAGS='-C target-feature=+sse2' cargo build --manifest-path ../../bindings/swc_cli/Cargo.toml --release --features plugin --target x86_64-unknown-linux-gnu &&
              rm -rf ../../target/target/x86_64-unknown-linux-gnu/release/.cargo-lock &&
              cp ../../target/x86_64-unknown-linux-gnu/release/swc . && chmod +x ./swc &&
              if [[ $PACKAGE == "core" ]]; then
                pnpm build --target x86_64-unknown-linux-gnu --no-default-features --features swc_v1,plugin
              else
                pnpm build --target x86_64-unknown-linux-gnu
              fi
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            # musl build is slow, let's disable the LTO
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-alpine@sha256:caac2d1b9194eada0c69e669e72763869701351d8957ab805cc45a43999d8be2
            build: >-
              set -e &&
              rm /etc/apk/repositories &&
              echo "https://dl-cdn.alpinelinux.org/alpine/v3.21/main" >> /etc/apk/repositories &&
              echo "https://dl-cdn.alpinelinux.org/alpine/v3.21/community" >> /etc/apk/repositories &&
              apk update &&
              apk add --upgrade clang-static llvm-dev &&
              export CARGO_PROFILE_RELEASE_LTO=false &&
              if [[ $PACKAGE == "core" ]]; then
                RUSTFLAGS='-C target-feature=+sse2' cargo build --manifest-path ../../bindings/swc_cli/Cargo.toml --release --features plugin --target x86_64-unknown-linux-musl &&
                rm -rf target/release/.cargo-lock &&
                cp ../../target/x86_64-unknown-linux-musl/release/swc . && chmod +x ./swc &&
                RUSTFLAGS='-C target-feature=+sse2 -C target-feature=-crt-static' pnpm build --target x86_64-unknown-linux-musl
              else
                RUSTFLAGS='-C target-feature=+sse2 -C target-feature=-crt-static' pnpm build --target x86_64-unknown-linux-musl
              fi
          - host: macos-latest
            target: aarch64-apple-darwin
            build: |
              sudo rm -Rf /Library/Developer/CommandLineTools/SDKs/*;
              export CC=$(xcrun -f clang);
              export CXX=$(xcrun -f clang++);
              SYSROOT=$(xcrun --sdk macosx --show-sdk-path);
              export CFLAGS="-isysroot $SYSROOT -isystem $SYSROOT";
              if [[ $PACKAGE == "core" ]]; then
                cargo build --manifest-path ../../bindings/swc_cli/Cargo.toml --release --features plugin --target aarch64-apple-darwin
                cp ../../target/aarch64-apple-darwin/release/swc .
                chmod +x ./swc
              fi
              pnpm build --target aarch64-apple-darwin
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-debian-aarch64@sha256:54509bac10132e6a4148fd5ef59c0057c37bb332221fb7448d907bd575936114
            build: >-
              set -e &&
              export JEMALLOC_SYS_WITH_LG_PAGE=16 &&
              rustup target add aarch64-unknown-linux-gnu &&
              if [[ $PACKAGE == "core" ]]; then
                RUSTFLAGS='' cargo build --manifest-path ../../bindings/swc_cli/Cargo.toml --release --features plugin --target aarch64-unknown-linux-gnu &&
                cp ../../target/aarch64-unknown-linux-gnu/release/swc . && chmod +x ./swc &&
                export CC_aarch64_unknown_linux_gnu=clang &&
                pnpm build --target aarch64-unknown-linux-gnu
              else
                export CC_aarch64_unknown_linux_gnu=clang &&
                pnpm build --target aarch64-unknown-linux-gnu
              fi
          - host: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            build: |
              export DISABLE_PLUGIN_E2E_TESTS=true
              if [[ $PACKAGE == "core" ]]; then
                pnpm exec napi build --bin swc --release --target armv7-unknown-linux-gnueabihf --manifest-path ../../bindings/swc_cli/Cargo.toml -x --target-dir ../release -o .
                chmod +x ./swc
                pnpm build --target armv7-unknown-linux-gnueabihf --no-default-features --features swc_v1 --use-napi-cross
              else
                pnpm build --target armv7-unknown-linux-gnueabihf --use-napi-cross
              fi
          - host: ubuntu-latest
            target: powerpc64le-unknown-linux-gnu
            build: |
              export DISABLE_PLUGIN_E2E_TESTS=true
              if [[ $PACKAGE == "core" ]]; then
                pnpm exec napi build --bin swc --release --target powerpc64le-unknown-linux-gnu --manifest-path ../../bindings/swc_cli/Cargo.toml -x --target-dir ../release -o .
                chmod +x ./swc
                pnpm build --target powerpc64le-unknown-linux-gnu --no-default-features --features swc_v1 --use-napi-cross
              else
                pnpm build --target powerpc64le-unknown-linux-gnu --use-napi-cross
              fi
          - host: ubuntu-latest
            target: s390x-unknown-linux-gnu
            build: |
              export DISABLE_PLUGIN_E2E_TESTS=true
              if [[ $PACKAGE == "core" ]]; then
                pnpm exec napi build --bin swc --release --target s390x-unknown-linux-gnu --manifest-path ../../bindings/swc_cli/Cargo.toml -x --target-dir ../release -o .
                chmod +x ./swc
                pnpm build --target s390x-unknown-linux-gnu --no-default-features --features swc_v1 --use-napi-cross
              else
                pnpm build --target s390x-unknown-linux-gnu --use-napi-cross
              fi
          - host: ubuntu-latest
            target: aarch64-unknown-linux-musl
            downloadTarget: aarch64-unknown-linux-musl
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-alpine@sha256:caac2d1b9194eada0c69e669e72763869701351d8957ab805cc45a43999d8be2
            # This image does not provide aarch64-linux-musl-gcc, which is the linker
            # name configured in .cargo/config.toml, so route that name through Zig.
            build: |
              set -euo pipefail

              rm /etc/apk/repositories
              echo "https://dl-cdn.alpinelinux.org/alpine/v3.21/main" >> /etc/apk/repositories
              echo "https://dl-cdn.alpinelinux.org/alpine/v3.21/community" >> /etc/apk/repositories
              apk update
              apk add --upgrade clang-static llvm-dev zig
              cat > /usr/local/bin/aarch64-linux-musl-gcc <<'EOF'
              #!/usr/bin/env bash
              set -euo pipefail

              args=()
              uses_rust_crt=false

              for arg in "$@"; do
                case "$arg" in
                  -lgcc | -lgcc_s) ;;
                  */rustlib/aarch64-unknown-linux-musl/lib/self-contained/crt1.o | */rustlib/aarch64-unknown-linux-musl/lib/self-contained/Scrt1.o | */rustlib/aarch64-unknown-linux-musl/lib/self-contained/rcrt1.o | */rustlib/aarch64-unknown-linux-musl/lib/self-contained/crti.o)
                    uses_rust_crt=true
                    args+=("$arg")
                    ;;
                  *) args+=("$arg") ;;
                esac
              done

              if [[ "$uses_rust_crt" == true ]]; then
                ld_args=()

                for arg in "${args[@]}"; do
                  case "$arg" in
                    -Wl,*)
                      IFS="," read -r -a parts <<< "${arg#-Wl,}"
                      for part in "${parts[@]}"; do
                        [[ -n "$part" ]] && ld_args+=("$part")
                      done
                      ;;
                    -nostartfiles | -nodefaultlibs) ;;
                    *) ld_args+=("$arg") ;;
                  esac
                done

                # Rust passes its self-contained musl CRT objects for static binaries.
                # Calling Zig cc would add Zig's CRT too, so call lld directly for that path.
                exec zig ld.lld -m aarch64linux "${ld_args[@]}"
              fi

              # Zig provides compiler-rt for this target, so drop GCC runtime flags.
              exec zig cc -target aarch64-linux-musl "${args[@]}"
              EOF
              chmod +x /usr/local/bin/aarch64-linux-musl-gcc
              export JEMALLOC_SYS_WITH_LG_PAGE=16
              rustup toolchain install "$(cat ../../rust-toolchain)"
              rustup target add aarch64-unknown-linux-musl
              if [[ $PACKAGE == "core" ]]; then
                RUSTFLAGS='-C target-feature=+crt-static -C link-arg=-lgcc' cargo build --manifest-path ../../bindings/swc_cli/Cargo.toml --release --features plugin --target aarch64-unknown-linux-musl
                rm -rf target/release/.cargo-lock
                cp ../../target/aarch64-unknown-linux-musl/release/swc .
                chmod +x ./swc
                env RUSTFLAGS='-C target-feature=-crt-static' pnpm build --target=aarch64-unknown-linux-musl
              else
                env RUSTFLAGS='-C target-feature=-crt-static' pnpm build --target=aarch64-unknown-linux-musl
              fi
          - host: windows-latest
            target: aarch64-pc-windows-msvc
            # Disable `LTO` and increase `codegen-units` to avoid llvm `OOM` on GitHub Actions.
            build: |
              export DISABLE_PLUGIN_E2E_TESTS=true
              export CARGO_PROFILE_RELEASE_CODEGEN_UNITS=256
              export CARGO_PROFILE_RELEASE_LTO=false
              if [[ $PACKAGE == "core" ]]; then
                cargo build --manifest-path ../../bindings/swc_cli/Cargo.toml --release --target aarch64-pc-windows-msvc
                cp ../../target/aarch64-pc-windows-msvc/release/swc.exe .
                pnpm build --target aarch64-pc-windows-msvc --no-default-features --features swc_v1
              else
                pnpm build --target aarch64-pc-windows-msvc
              fi
    name: "Build ${{ matrix.package }} - ${{ matrix.settings.target }} - node@20"
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          ref: "v${{ inputs.version }}"
          submodules: recursive

      - name: Corepack
        shell: bash
        run: corepack enable
      - name: Setup node x64
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          architecture: x64
      - name: Output toolchain
        id: toolchain
        shell: bash
        run: echo "version=$(cat ./rust-toolchain)" >> "$GITHUB_OUTPUT"
      - name: Install
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        if: ${{ !matrix.settings.docker }}
        with:
          targets: ${{ matrix.settings.target }}
          toolchain: ${{ steps.toolchain.outputs.version }}
      # `pnpm exec napi build ... -x` invokes `cargo-zigbuild`, which requires zig on the runner.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        if: ${{ matrix.settings.target == 'armv7-unknown-linux-gnueabihf' || matrix.settings.target == 'powerpc64le-unknown-linux-gnu' || matrix.settings.target == 's390x-unknown-linux-gnu' }}
        with:
          version: 0.15.1
      - name: Install dependencies
        shell: bash
        env:
          TARGET: ${{ matrix.settings.target }}
        run: |
          corepack enable
          if [[ "$TARGET" == "i686-pc-windows-msvc" ]]; then
            pnpm install --frozen-lockfile --cpu=ia32
          else
            pnpm install --frozen-lockfile
          fi
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          echo '/usr/local/cargo/bin' >> $GITHUB_PATH
      - name: Setup node x86
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: matrix.settings.target == 'i686-pc-windows-msvc'
        with:
          node-version: 20
          architecture: x86
      - name: Build in docker
        if: ${{ matrix.settings.docker }}
        shell: bash
        env:
          TARGET: ${{ matrix.settings.target }}
          BUILD_SCRIPT: ${{ matrix.settings.build }}
          DOCKER_IMAGE: ${{ matrix.settings.docker }}
          PACKAGE: ${{ matrix.package }}
          WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          case "$PACKAGE" in
            core | html | minifier | react-compiler) ;;
            *)
              echo "Unsupported package: $PACKAGE" >&2
              exit 1
              ;;
          esac

          PACKAGE_MANAGER="$(node -p "require('./package.json').packageManager")"
          case "$PACKAGE_MANAGER" in
            pnpm@*) ;;
            *)
              echo "Unsupported packageManager: $PACKAGE_MANAGER" >&2
              exit 1
              ;;
          esac

          BUILD_SCRIPT+=$'\nnode ../../scripts/native/finalize.mjs "$PACKAGE" "$TARGET" "../../target/native-reports/$PACKAGE-$TARGET.json"\n'
          export SOURCE_COMMIT="$(git rev-parse HEAD)"
          mkdir -p "$HOME/.cargo/git" "$HOME/.cargo/registry"
          docker run --rm \
            -e SOURCE_COMMIT \
            -e BUILD_SCRIPT \
            -e TARGET \
            -e BUILD_TYPE \
            -e RELEASE_VERSION \
            -e COREPACK_VERSION="$COREPACK_VERSION" \
            -e PACKAGE \
            -e PACKAGE_MANAGER="$PACKAGE_MANAGER" \
            -v "$HOME/.cargo/git:/root/.cargo/git" \
            -v "$HOME/.cargo/registry:/root/.cargo/registry" \
            -v "$WORKSPACE:/build" \
            -w /build \
            "$DOCKER_IMAGE" \
            bash -lc 'set -euo pipefail; cd "/build/packages/${PACKAGE}"; npm install -g "corepack@${COREPACK_VERSION}"; corepack enable; corepack prepare "${PACKAGE_MANAGER}" --activate; npm i -g wasm-pack; bash -e -o pipefail -lc "$BUILD_SCRIPT"'
      - name: Build
        if: ${{ !matrix.settings.docker }}
        shell: bash
        env:
          TARGET: ${{ matrix.settings.target }}
          BUILD_SCRIPT: ${{ matrix.settings.build }}
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          case "$PACKAGE" in
            core | html | minifier | react-compiler) ;;
            *)
              echo "Unsupported package: $PACKAGE" >&2
              exit 1
              ;;
          esac

          cd "packages/$PACKAGE"
          BUILD_SCRIPT+=$'\nnode ../../scripts/native/finalize.mjs "$PACKAGE" "$TARGET" "../../target/native-reports/$PACKAGE-$TARGET.json"\n'
          bash -e -o pipefail -lc "$BUILD_SCRIPT"
      - name: Verify final upload bytes
        shell: bash
        env:
          PACKAGE: ${{ matrix.package }}
          TARGET: ${{ matrix.settings.target }}
        run: node scripts/native/check-artifact.mjs "$PACKAGE" "$TARGET" "target/native-reports/$PACKAGE-$TARGET.json"
      - name: Upload native report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-report-${{ inputs.buildType }}-${{ matrix.package }}-${{ inputs.version }}-${{ matrix.settings.target }}
          path: target/native-reports/${{ matrix.package }}-${{ matrix.settings.target }}.json
          if-no-files-found: error
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bindings-${{ inputs.buildType }}-${{ matrix.package }}-${{ inputs.version}}-${{ matrix.settings.target }}
          path: |
            packages/${{ matrix.package }}/swc*
            packages/${{ matrix.package }}/*.node
          if-no-files-found: error
  assemble:
    name: Assemble ${{ matrix.package }}@${{ inputs.version }}
    strategy:
      fail-fast: false
      matrix:
        package: [core, html, minifier, react-compiler]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [build]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          ref: "v${{ inputs.version }}"
          submodules: recursive

      - uses: ./.github/actions/setup-node
        with:
          cache: "false"

      - name: Install dependencies
        run: corepack enable && pnpm install --frozen-lockfile

      - name: Download all artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: "bindings-${{ inputs.buildType }}-${{ matrix.package }}-${{ inputs.version}}-*"
          path: ./packages/${{ matrix.package }}/artifacts

      - name: List binaries
        shell: bash
        env:
          PACKAGE: ${{ matrix.package }}
        run: ls -R "packages/$PACKAGE/artifacts"

      - name: Move binaries
        shell: bash
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          cd "packages/$PACKAGE"
          ./scripts/cli_artifacts.sh
          ls -R ./artifacts
          ls -R ./artifacts_cli
          npm run artifacts

      - name: List npm
        shell: bash
        env:
          PACKAGE: ${{ matrix.package }}
        run: ls -R "packages/$PACKAGE/scripts/npm"

      - name: Set fallback dependencies
        shell: bash
        run: |
          node ./scripts/update_fallback_dependencies.js

      - uses: ./.github/actions/native-tools
      - name: Download verification reports
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: native-report-${{ inputs.buildType }}-${{ matrix.package }}-${{ inputs.version }}-*
          merge-multiple: true
          path: target/native-reports
      - name: Prepare and verify npm tarballs
        shell: bash
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          # napi prepublish also creates/uploads GitHub releases when this is set.
          # Perform those writes only after the shared gate, using verified bytes.
          env -u GITHUB_REPOSITORY pnpm --filter "./packages/$PACKAGE" prepack
          node scripts/native/assemble.mjs "$PACKAGE" target/native-reports "target/npm/$PACKAGE"
      - name: Upload prepared packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-npm-${{ inputs.buildType }}-${{ matrix.package }}-${{ inputs.version }}
          path: target/npm/${{ matrix.package }}
          if-no-files-found: error

  test-macOS-windows-binding:
    name: Test ${{ matrix.package }} bindings on ${{ matrix.settings.target }} - node@${{ matrix.node }}
    needs:
      - assemble
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package: [core, html, minifier, react-compiler]
        settings:
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            architecture: x64
          - host: windows-11-arm
            target: aarch64-pc-windows-msvc
            architecture: arm64
          - host: macos-latest
            target: x86_64-apple-darwin
            architecture: x64
          - host: macos-latest
            target: aarch64-apple-darwin
            architecture: arm64
        node:
          - "20"
          - "22"
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          ref: "v${{ inputs.version }}"
          submodules: recursive

      - run: corepack enable
        shell: bash
      - name: Setup node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
          architecture: ${{ matrix.settings.architecture }}
      - name: Install dependencies
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Download artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: bindings-${{ inputs.buildType }}-${{ matrix.package }}-${{ inputs.version}}-${{ matrix.settings.target }}
          path: ./packages/${{ matrix.package }}
      - name: Download verification report
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: native-report-${{ inputs.buildType }}-${{ matrix.package }}-${{ inputs.version }}-${{ matrix.settings.target }}
          path: target/native-reports
      - name: Download prepared npm packages
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: native-npm-${{ inputs.buildType }}-${{ matrix.package }}-${{ inputs.version }}
          path: target/npm/${{ matrix.package }}
      - uses: ./.github/actions/native-tools
      - name: Verify and extract raw comparison image
        shell: bash
