[package]
authors     = ["강동윤 <kdy1997.dev@gmail.com>", "OJ Kwon <kwon.ohjoong@gmail.com>"]
description = "Commandline for SWC (Internal crate with implementation)"
edition     = { workspace = true }
include     = ["Cargo.toml", "src/**/*.rs"]
license     = { workspace = true }
name        = "swc_cli_impl"
repository  = { workspace = true }
version     = "84.0.1"

[[bin]]
name = "swc"
path = "src/main.rs"

[lib]
crate-type = ["rlib"]
path       = "src/lib.rs"

[features]
default = []
plugin = [
  "swc_core/plugin_backend_wasmer",
  "swc_core/plugin_transform_host_native",
  "swc_core/plugin_transform_host_native_filesystem_cache",
]

[dependencies]
anyhow = { workspace = true, default-features = false }
clap = { version = "4.0.0", features = ["derive", "wrap_help", "std"], default-features = false }
glob = { workspace = true, default-features = false }
notify          = { workspace = true }
par-core = { workspace = true, features = ["chili"], default-features = false }
par-iter = { workspace = true, default-features = false }
path-absolutize = { workspace = true, features = ["fixed_workdir"], default-features = false }
pathdiff        = { workspace = true }
serde_json = { workspace = true, features = ["unbounded_depth"], default-features = false }
tracing = { workspace = true, default-features = false }
walkdir = { workspace = true, default-features = false }

swc_core = { version = "84.2.0", features = [
  "common_concurrent",
  "base_concurrent",
  "base_flow",
  "base_isolated_dts",
  "base_module",
  "base_react_compiler",
  "ecma_helpers_inline",
], path = "../swc_core" }

[dev-dependencies]
assert_cmd = { workspace = true, default-features = false }
assert_fs = { workspace = true, default-features = false }
base64     = { workspace = true }
