[package]
authors     = ["강동윤 <kdy1997.dev@gmail.com>"]
description = "Debug utilities"
edition     = { workspace = true }
license     = { workspace = true }
name        = "dbg-swc"
repository  = { workspace = true }
version     = "66.0.0"

[[bin]]
bench = false
name  = "dbg-swc"

[dependencies]
anyhow = { workspace = true, default-features = false }
clap = { version = "4", features = [
  "derive",
  "std",
  "help",
  "usage",
  "error-context",
], default-features = false }
dialoguer = { workspace = true, default-features = false }
flate2 = { workspace = true, default-features = false }
par-core = { workspace = true, features = ["chili"], default-features = false }
par-iter = { workspace = true, default-features = false }
rayon = { workspace = true, default-features = false }
serde = { workspace = true, default-features = false }
serde_json = { workspace = true, default-features = false }
sha1 = { workspace = true, default-features = false }
swc_common = { version = "28.0.0", features = [
  "concurrent",
  "tty-emitter",
], path = "../swc_common" }
swc_ecma_ast = { version = "31.0.0", path = "../swc_ecma_ast", default-features = false }
swc_ecma_codegen = { version = "34.0.0", path = "../swc_ecma_codegen", default-features = false }
swc_ecma_minifier = { version = "65.0.0", path = "../swc_ecma_minifier", features = [
  "concurrent",
] }
swc_ecma_parser = { version = "48.0.0", path = "../swc_ecma_parser", features = [
  "flow",
], default-features = false }
swc_ecma_transforms_base = { version = "52.0.0", path = "../swc_ecma_transforms_base", default-features = false }
swc_ecma_transforms_typescript = { version = "58.0.0", path = "../swc_ecma_transforms_typescript" }
swc_ecma_visit = { version = "31.0.0", path = "../swc_ecma_visit", default-features = false }
swc_error_reporters = { version = "30.0.0", path = "../swc_error_reporters", default-features = false }
tempfile = { workspace = true, default-features = false }
tracing = { workspace = true, default-features = false }
tracing-subscriber = { workspace = true, features = [
  "fmt",
  "env-filter",
  "ansi",
] }
