[package]
authors     = ["강동윤 <kdy1997.dev@gmail.com>"]
description = "Binding module for swc_ts_fast_strip"
edition     = { workspace = true }
license     = { workspace = true }
name        = "swc_ts_fast_strip_binding"
repository  = { workspace = true }
version     = "0.25.0"

[lib]
bench = false

[features]

[dependencies]
anyhow              = { workspace = true }
miette              = { workspace = true }
owo-colors          = { workspace = true }
serde               = { workspace = true, features = ["derive"] }
swc_common          = { version = "27.0.0", path = "../../crates/swc_common" }
swc_error_reporters = { version = "29.0.0", path = "../../crates/swc_error_reporters" }
swc_ts_fast_strip   = { version = "60.0.0", path = "../../crates/swc_ts_fast_strip" }
tracing             = { workspace = true }
unicode-width       = { workspace = true }

[dev-dependencies]
codspeed-criterion-compat.workspace = true
serde_json.workspace                = true
swc_ecma_parser                     = { version = "47.0.0", path = "../../crates/swc_ecma_parser" }

[[bench]]
harness = false
name    = "assets"
