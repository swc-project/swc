[package]
authors       = ["강동윤 <kdy1997.dev@gmail.com>"]
description   = "ES2015 compatibility transforms"
documentation = "https://rustdoc.swc.rs/swc_ecma_compat_es2015/"
edition       = { workspace = true }
include       = ["Cargo.toml", "src/**/*.rs"]
license       = { workspace = true }
name          = "swc_ecma_compat_es2015"
repository    = { workspace = true }
version       = "58.0.0"


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(swc_ast_unknown)'] }

[dependencies]
arrayvec     = { workspace = true, default-features = false }
indexmap     = { workspace = true, default-features = false }
is-macro     = { workspace = true, default-features = false }
rustc-hash   = { workspace = true, default-features = false }
serde        = { workspace = true, default-features = false }
serde_derive = { workspace = true, default-features = false }
smallvec     = { workspace = true, default-features = false }
swc_atoms    = { version = "11.0.0", path = "../swc_atoms", default-features = false }


swc_common                  = { version = "28.0.0", path = "../swc_common", default-features = false }
swc_config                  = { version = "7.0.0", path = "../swc_config", default-features = false }
swc_ecma_ast                = { version = "31.0.0", path = "../swc_ecma_ast", default-features = false }
swc_ecma_compat_common      = { version = "48.0.0", path = "../swc_ecma_compat_common", default-features = false }
swc_ecma_transformer        = { version = "24.0.0", path = "../swc_ecma_transformer" }
swc_ecma_transforms_base    = { version = "52.0.0", path = "../swc_ecma_transforms_base", default-features = false }
swc_ecma_transforms_classes = { version = "52.0.0", path = "../swc_ecma_transforms_classes", default-features = false }
swc_ecma_transforms_macros  = { version = "2.0.0", path = "../swc_ecma_transforms_macros", default-features = false }
swc_ecma_utils              = { version = "37.0.0", path = "../swc_ecma_utils", default-features = false }
swc_ecma_visit              = { version = "31.0.0", path = "../swc_ecma_visit", default-features = false }
tracing                     = { workspace = true }

[dev-dependencies]
swc_ecma_parser             = { version = "48.0.0", path = "../swc_ecma_parser", default-features = false }
swc_ecma_transforms_testing = { version = "56.0.0", path = "../swc_ecma_transforms_testing", default-features = false }
