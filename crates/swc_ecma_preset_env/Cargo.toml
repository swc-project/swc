[package]
authors = ["강동윤 <kdy1997.dev@gmail.com>"]
description = "preset-env for the swc"
documentation = "https://rustdoc.swc.rs/swc_ecma_preset_env/"
edition = { workspace = true }
include = [
  "Cargo.toml",
  "build.rs",
  "src/**/*.rs",
  "src/**/*.json",
  "data/**/*.json",
]
license = { workspace = true }
name = "swc_ecma_preset_env"
repository = { workspace = true }
version = "68.0.1"

[lib]
bench = false

[features]
default    = ["serde-impl"]
es3        = ["swc_ecma_transforms/es3"]
serde-impl = ["serde"]

[dependencies]
indexmap = { workspace = true, default-features = false }
once_cell = { workspace = true, default-features = false }
serde = { workspace = true, features = ["derive"], optional = true, default-features = false }
serde_json = { workspace = true, default-features = false }

preset_env_base = { version = "11.0.0", path = "../preset_env_base", default-features = false }

foldhash = { workspace = true, default-features = false }
precomputed-map = { workspace = true }

rustc-hash = { workspace = true, default-features = false }
string_enum = { version = "1.0.2", path = "../string_enum", default-features = false }
swc_atoms = { version = "10.0.1", path = "../swc_atoms", default-features = false }
swc_common = { version = "27.0.0", path = "../swc_common", default-features = false }
swc_ecma_ast = { version = "30.0.2", path = "../swc_ecma_ast", default-features = false }
swc_ecma_transformer = { version = "23.1.0", path = "../swc_ecma_transformer" }
swc_ecma_transforms = { version = "65.0.1", path = "../swc_ecma_transforms", features = [
  "compat",
  "proposal",
] }
swc_ecma_utils = { version = "36.1.1", path = "../swc_ecma_utils", default-features = false }
swc_ecma_visit = { version = "30.0.0", path = "../swc_ecma_visit", default-features = false }

[build-dependencies]
anyhow = { workspace = true, features = ["std"], default-features = false }
foldhash = { workspace = true, default-features = false }
precomputed-map = { workspace = true, features = ["builder"] }
rustc-hash = { workspace = true, features = ["std"], default-features = false }
serde = { workspace = true, features = ["derive"], default-features = false }
serde_json = { workspace = true, default-features = false }

[dev-dependencies]
codspeed-criterion-compat = { workspace = true }
pretty_assertions = { workspace = true, default-features = false }

swc_ecma_codegen = { version = "33.0.2", path = "../swc_ecma_codegen", default-features = false }
swc_ecma_parser = { version = "47.1.0", path = "../swc_ecma_parser", default-features = false }
swc_ecma_transforms_base = { version = "51.0.3", path = "../swc_ecma_transforms_base", features = [
  "inline-helpers",
] }
swc_ecma_transforms_testing = { version = "55.1.0", path = "../swc_ecma_transforms_testing" }
testing = { version = "28.0.1", path = "../testing", default-features = false }

[[bench]]
harness = false
name    = "polyfills"
