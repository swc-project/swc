[package]
authors = ["강동윤 <kdy1997.dev@gmail.com>"]
description = "preset-env for the swc"
documentation = "https://rustdoc.swc.rs/swc_ecma_preset_env/"
edition = { workspace = true }
include = [
  "Cargo.toml",
  "build.rs",
  "src/**/*.rs",
  "src/**/*.json",
  "data/**/*.json",
]
license = { workspace = true }
name = "swc_ecma_preset_env"
repository = { workspace = true }
version = "69.0.0"

[lib]
bench = false

[features]
default    = ["serde-impl"]
es3        = ["swc_ecma_transforms/es3"]
serde-impl = ["serde"]

[dependencies]
indexmap = { workspace = true, default-features = false }
once_cell = { workspace = true, default-features = false }
serde = { workspace = true, features = [
  "derive",
], optional = true, default-features = false }
serde_json = { workspace = true, default-features = false }

preset_env_base = { version = "12.0.0", path = "../preset_env_base", default-features = false }

foldhash        = { workspace = true, default-features = false }
precomputed-map = { workspace = true }

rustc-hash = { workspace = true, default-features = false }
string_enum = { version = "2.0.0", path = "../string_enum", default-features = false }
swc_atoms = { version = "11.0.0", path = "../swc_atoms", default-features = false }
swc_common = { version = "28.0.0", path = "../swc_common", default-features = false }
swc_ecma_ast = { version = "31.0.0", path = "../swc_ecma_ast", default-features = false }
swc_ecma_transformer = { version = "24.0.0", path = "../swc_ecma_transformer" }
swc_ecma_transforms = { version = "66.0.0", path = "../swc_ecma_transforms", features = [
  "compat",
  "proposal",
] }
swc_ecma_utils = { version = "37.0.0", path = "../swc_ecma_utils", default-features = false }
swc_ecma_visit = { version = "31.0.0", path = "../swc_ecma_visit", default-features = false }

[build-dependencies]
anyhow          = { workspace = true, features = ["std"], default-features = false }
foldhash        = { workspace = true, default-features = false }
precomputed-map = { workspace = true, features = ["builder"] }
rustc-hash      = { workspace = true, features = ["std"], default-features = false }
serde           = { workspace = true, features = ["derive"], default-features = false }
serde_json      = { workspace = true, default-features = false }

[dev-dependencies]
codspeed-criterion-compat = { workspace = true }
pretty_assertions         = { workspace = true, default-features = false }

swc_ecma_codegen = { version = "34.0.0", path = "../swc_ecma_codegen", default-features = false }
swc_ecma_parser = { version = "48.0.0", path = "../swc_ecma_parser", default-features = false }
swc_ecma_transforms_base = { version = "52.0.0", path = "../swc_ecma_transforms_base", features = [
  "inline-helpers",
] }
swc_ecma_transforms_testing = { version = "56.0.0", path = "../swc_ecma_transforms_testing" }
testing = { version = "29.0.0", path = "../testing", default-features = false }

[[bench]]
harness = false
name    = "polyfills"
