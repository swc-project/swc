[package]
authors       = ["강동윤 <kdy1997.dev@gmail.com>"]
description   = "rust port of babel and closure compiler."
documentation = "https://rustdoc.swc.rs/swc_ecma_transforms_compat/"
edition       = { workspace = true }
include       = ["Cargo.toml", "src/**/*.rs"]
license       = { workspace = true }
name          = "swc_ecma_transforms_compat"
repository    = { workspace = true }
version       = "60.0.0"

[lib]
bench = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(swc_ast_unknown)'] }

[features]
concurrent = [
  "swc_ecma_transforms_base/concurrent",
  "swc_ecma_utils/concurrent",
]
default = []
es3 = ["swc_ecma_compat_es3"]

[dependencies]
indexmap = { workspace = true, default-features = false }
par-core = { workspace = true, default-features = false }
serde    = { workspace = true, features = ["derive"], default-features = false }
tracing  = { workspace = true, default-features = false }

swc_atoms                = { version = "11.0.0", path = "../swc_atoms", default-features = false }
swc_common               = { version = "28.0.0", path = "../swc_common", default-features = false }
swc_ecma_ast             = { version = "31.0.0", path = "../swc_ecma_ast", default-features = false }
swc_ecma_compat_bugfixes = { version = "59.0.0", path = "../swc_ecma_compat_bugfixes", default-features = false }
swc_ecma_compat_common   = { version = "48.0.0", path = "../swc_ecma_compat_common", default-features = false }
swc_ecma_compat_es2015   = { version = "58.0.0", path = "../swc_ecma_compat_es2015", default-features = false }
swc_ecma_compat_es2016   = { version = "53.0.0", path = "../swc_ecma_compat_es2016", default-features = false }
swc_ecma_compat_es2017   = { version = "53.0.0", path = "../swc_ecma_compat_es2017", default-features = false }
swc_ecma_compat_es2018   = { version = "54.0.0", path = "../swc_ecma_compat_es2018", default-features = false }
swc_ecma_compat_es2019   = { version = "53.0.0", path = "../swc_ecma_compat_es2019", default-features = false }
swc_ecma_compat_es2020   = { version = "56.0.0", path = "../swc_ecma_compat_es2020", default-features = false }
swc_ecma_compat_es2021   = { version = "53.0.0", path = "../swc_ecma_compat_es2021", default-features = false }
swc_ecma_compat_es2022   = { version = "56.0.0", path = "../swc_ecma_compat_es2022", default-features = false }
swc_ecma_compat_es3      = { version = "44.0.0", path = "../swc_ecma_compat_es3", optional = true, default-features = false }
swc_ecma_transforms_base = { version = "52.0.0", path = "../swc_ecma_transforms_base" }
swc_ecma_utils           = { version = "37.0.0", path = "../swc_ecma_utils", default-features = false }
swc_ecma_visit           = { version = "31.0.0", path = "../swc_ecma_visit", default-features = false }

[dev-dependencies]
par-core   = { workspace = true, features = ["chili"], default-features = false }
serde_json = { workspace = true, default-features = false }

swc_ecma_parser = { version = "48.0.0", path = "../swc_ecma_parser", default-features = false }
swc_ecma_transforms_base = { version = "52.0.0", path = "../swc_ecma_transforms_base", features = [
  "inline-helpers",
] }
swc_ecma_transforms_testing = { version = "56.0.0", path = "../swc_ecma_transforms_testing", default-features = false }
testing = { version = "29.0.0", path = "../testing", default-features = false }
