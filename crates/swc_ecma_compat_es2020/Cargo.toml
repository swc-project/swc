[package]
authors       = ["강동윤 <kdy1997.dev@gmail.com>"]
description   = "ES2020 compatibility transforms"
documentation = "https://rustdoc.swc.rs/swc_ecma_compat_es2020/"
edition       = { workspace = true }
include       = ["Cargo.toml", "src/**/*.rs"]
license       = { workspace = true }
name          = "swc_ecma_compat_es2020"
repository    = { workspace = true }
version       = "55.0.0"


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(swc_ast_unknown)'] }

[dependencies]
serde = { workspace = true, features = ["derive"], default-features = false }
tracing = { workspace = true, default-features = false }

swc_common = { version = "27.0.0", path = "../swc_common", default-features = false }
swc_ecma_ast = { version = "30.0.2", path = "../swc_ecma_ast", default-features = false }
swc_ecma_compat_es2022 = { version = "55.0.0", path = "../swc_ecma_compat_es2022", default-features = false }
swc_ecma_transformer     = { version = "23.1.0", path = "../swc_ecma_transformer" }
swc_ecma_transforms_base = { version = "51.0.3", path = "../swc_ecma_transforms_base", default-features = false }
swc_ecma_utils = { version = "36.1.1", path = "../swc_ecma_utils", default-features = false }
swc_ecma_visit = { version = "30.0.0", path = "../swc_ecma_visit", default-features = false }

[dev-dependencies]
