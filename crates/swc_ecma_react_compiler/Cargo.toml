[package]
description   = "SWC helpers for the React Compiler"
documentation = "https://rustdoc.swc.rs/swc_ecma_react_compiler/"
edition       = { workspace = true }
license       = { workspace = true }
name          = "swc_ecma_react_compiler"
repository    = { workspace = true }
version       = "27.0.0"


[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
indexmap = { workspace = true, features = ["serde"] }
react_compiler = { version = "=0.1.0", package = "swc_fork_react_compiler" }
react_compiler_ast = { version = "=0.1.0", package = "swc_fork_react_compiler_ast" }
react_compiler_hir = { version = "=0.1.0", package = "swc_fork_react_compiler_hir" }
rustc-hash = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
swc_atoms = { version = "10.0.1", path = "../swc_atoms" }
swc_common = { version = "27.0.0", path = "../swc_common", default-features = false }
swc_ecma_ast = { version = "30.0.2", path = "../swc_ecma_ast", default-features = false }
swc_ecma_codegen = { version = "33.0.2", path = "../swc_ecma_codegen" }
swc_ecma_parser = { version = "47.1.0", path = "../swc_ecma_parser", default-features = false, features = [
  "typescript",
] }
swc_ecma_utils = { version = "36.1.1", path = "../swc_ecma_utils", features = [
  "stacker",
] }
swc_ecma_visit = { version = "30.0.0", path = "../swc_ecma_visit", default-features = false }

[dev-dependencies]
swc_common = { version = "27.0.0", path = "../swc_common" }
swc_ecma_parser = { version = "47.1.0", path = "../swc_ecma_parser", default-features = false, features = [
  "typescript",
] }
testing = { version = "28.0.1", path = "../testing", default-features = false }
