[package]
authors       = ["강동윤 <kdy1997.dev@gmail.com>"]
description   = "rust port of babel and closure compiler."
documentation = "https://rustdoc.swc.rs/swc_ecma_transforms_typescript/"
edition       = { workspace = true }
include       = ["Cargo.toml", "src/**/*.rs", "examples/**/*.rs"]
license       = { workspace = true }
name          = "swc_ecma_transforms_typescript"
repository    = { workspace = true }
version       = "57.0.3"

[lib]
bench = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(swc_ast_unknown)'] }

[features]
concurrent = ["swc_common/concurrent"]
es3        = ["swc_ecma_transforms_compat/es3"]

[dependencies]
bytes-str = { workspace = true, default-features = false }
rustc-hash = { workspace = true, default-features = false }
serde = { workspace = true, features = ["derive"], default-features = false }

swc_atoms = { version = "10.0.1", path = "../swc_atoms", default-features = false }
swc_common = { version = "27.0.0", path = "../swc_common", default-features = false }
swc_ecma_ast = { version = "30.0.2", path = "../swc_ecma_ast", default-features = false }
swc_ecma_transforms_base = { version = "51.0.3", path = "../swc_ecma_transforms_base", default-features = false }
swc_ecma_transforms_react = { version = "57.0.2", path = "../swc_ecma_transforms_react", features = ["serde-impl"], default-features = false }
swc_ecma_utils = { version = "36.1.1", path = "../swc_ecma_utils", default-features = false }
swc_ecma_visit = { version = "30.0.0", path = "../swc_ecma_visit", default-features = false }

[dev-dependencies]
codspeed-criterion-compat = { workspace = true }

serde_json = { workspace = true }
swc_ecma_codegen = { version = "33.0.2", path = "../swc_ecma_codegen", default-features = false }
swc_ecma_parser = { version = "47.1.0", path = "../swc_ecma_parser", features = [
  "flow",
], default-features = false }
swc_ecma_transforms_compat = { version = "59.0.3", path = "../swc_ecma_transforms_compat", default-features = false }
swc_ecma_transforms_proposal = { version = "51.0.1", path = "../swc_ecma_transforms_proposal", default-features = false }
swc_ecma_transforms_testing = { version = "55.1.0", path = "../swc_ecma_transforms_testing", default-features = false }
testing = { version = "28.0.1", path = "../testing", default-features = false }

[[bench]]
harness = false
name    = "compat"
