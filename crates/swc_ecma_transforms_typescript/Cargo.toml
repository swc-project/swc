[package]
authors       = ["강동윤 <kdy1997.dev@gmail.com>"]
description   = "rust port of babel and closure compiler."
documentation = "https://rustdoc.swc.rs/swc_ecma_transforms_typescript/"
edition       = { workspace = true }
include       = ["Cargo.toml", "src/**/*.rs", "examples/**/*.rs"]
license       = { workspace = true }
name          = "swc_ecma_transforms_typescript"
repository    = { workspace = true }
version       = "58.0.0"

[lib]
bench = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(swc_ast_unknown)'] }

[features]
concurrent = ["swc_common/concurrent"]
es3        = ["swc_ecma_transforms_compat/es3"]

[dependencies]
bytes-str  = { workspace = true, default-features = false }
rustc-hash = { workspace = true, default-features = false }
serde      = { workspace = true, features = ["derive"], default-features = false }

swc_atoms = { version = "11.0.0", path = "../swc_atoms", default-features = false }
swc_common = { version = "28.0.0", path = "../swc_common", default-features = false }
swc_ecma_ast = { version = "31.0.0", path = "../swc_ecma_ast", default-features = false }
swc_ecma_transforms_base = { version = "52.0.0", path = "../swc_ecma_transforms_base", default-features = false }
swc_ecma_transforms_react = { version = "58.0.0", path = "../swc_ecma_transforms_react", features = [
  "serde-impl",
], default-features = false }
swc_ecma_utils = { version = "37.0.0", path = "../swc_ecma_utils", default-features = false }
swc_ecma_visit = { version = "31.0.0", path = "../swc_ecma_visit", default-features = false }

[dev-dependencies]
codspeed-criterion-compat = { workspace = true }

serde_json = { workspace = true }
swc_ecma_codegen = { version = "34.0.0", path = "../swc_ecma_codegen", default-features = false }
swc_ecma_parser = { version = "48.0.0", path = "../swc_ecma_parser", features = [
  "flow",
], default-features = false }
swc_ecma_transforms_compat = { version = "60.0.0", path = "../swc_ecma_transforms_compat", default-features = false }
swc_ecma_transforms_proposal = { version = "52.0.0", path = "../swc_ecma_transforms_proposal", default-features = false }
swc_ecma_transforms_testing = { version = "56.0.0", path = "../swc_ecma_transforms_testing", default-features = false }
testing = { version = "29.0.0", path = "../testing", default-features = false }

[[bench]]
harness = false
name    = "compat"
