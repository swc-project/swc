[package]
authors       = ["강동윤 <kdy1997.dev@gmail.com>"]
description   = "Super-fast TypeScript stripper based on SWC"
documentation = "https://rustdoc.swc.rs/swc_fast_type_strip/"
edition       = { workspace = true }
include       = ["Cargo.toml", "src/**/*.rs"]
license       = { workspace = true }
name          = "swc_ts_fast_strip"
repository    = { workspace = true }
version       = "61.0.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(swc_ast_unknown)'] }

[features]
default = []
nightly = []

[dependencies]
anyhow = { workspace = true, default-features = false }
serde = { workspace = true, features = ["derive"], default-features = false }
swc_atoms = { version = "11.0.0", path = "../swc_atoms", default-features = false }
swc_common = { version = "28.0.0", path = "../swc_common", features = [
  "sourcemap",
] }
swc_ecma_ast = { version = "31.0.0", path = "../swc_ecma_ast", default-features = false }
swc_ecma_codegen = { version = "34.0.0", path = "../swc_ecma_codegen", default-features = false }
swc_ecma_parser = { version = "48.0.0", path = "../swc_ecma_parser", default-features = false, features = [
  "typescript",
  "unstable",
] }
swc_ecma_transforms_base = { version = "52.0.0", path = "../swc_ecma_transforms_base", default-features = false }
swc_ecma_transforms_react = { version = "58.0.0", path = "../swc_ecma_transforms_react", features = [
  "serde-impl",
], default-features = false }
swc_ecma_transforms_typescript = { version = "58.0.0", path = "../swc_ecma_transforms_typescript", default-features = false }
swc_ecma_visit = { version = "31.0.0", path = "../swc_ecma_visit", default-features = false }
wasm-bindgen = { workspace = true, optional = true, default-features = false }

[dev-dependencies]
codspeed-criterion-compat = { workspace = true }
testing                   = { version = "29.0.0", path = "../testing", default-features = false }

[[bench]]
harness = false
name    = "assets"
