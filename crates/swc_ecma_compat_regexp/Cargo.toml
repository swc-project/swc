[package]
authors       = ["강동윤 <kdy1997.dev@gmail.com>"]
description   = "Transpiles modern RegExp features to ES5-compatible patterns"
documentation = "https://rustdoc.swc.rs/swc_ecma_compat_regexp/"
edition       = "2021"
include       = ["Cargo.toml", "src/**/*.rs"]
license       = { workspace = true }
name          = "swc_ecma_compat_regexp"
repository    = "https://github.com/swc-project/swc.git"
version       = "10.0.1"

[lib]
bench = false

[dependencies]
icu_properties = { version = "2.0.0", default-features = false, features = [
  "compiled_data",
  "alloc",
] }
# Only the simple case folding tables are used, to lower case-insensitive
# matching.
regex-syntax = { version = "0.8.11", default-features = false, features = [
  "std",
  "unicode-case",
] }

swc_common            = { version = "27.0.0", path = "../swc_common" }
swc_ecma_regexp_ast   = { version = "4.0.0", path = "../swc_ecma_regexp_ast" }
swc_ecma_regexp_visit = { version = "0.16.0", path = "../swc_ecma_regexp_visit" }

[dev-dependencies]
swc_ecma_regexp = { version = "0.16.0", path = "../swc_ecma_regexp" }
