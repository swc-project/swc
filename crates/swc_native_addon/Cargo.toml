[package]
name = "swc_native_addon"
version = "0.1.0"
edition = "2021"
rust-version = "1.73"
license = "Apache-2.0"
publish = false
description = "Private verified native addon payload and materialization support"

[dependencies]
sha2 = "=0.10.8"
tempfile = "=3.12.0"
tracing = { version = "=0.1.41", default-features = false, features = ["std"] }
zstd = { version = "=0.13.3", default-features = false }

# Newer jobserver releases require Rust 1.85. zstd's C build enables cc's
# parallel feature, so constrain this transitive host dependency for Rust 1.73.
[build-dependencies]
jobserver = "=0.1.32"

[package.metadata.cargo-shear]
ignored = ["jobserver"]

[target.'cfg(unix)'.dependencies]
libc = "=0.2.177"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.52.0", features = [
  "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization",
  "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl",
  "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Threading",
] }

[dev-dependencies]
libloading = "=0.8.1"
